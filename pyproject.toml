[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoc"
version = "0.1.0"
description = "C source code generation package"
authors = [{name = "Oleg A. Khlybov", email = "fougas@mail.ru"}]
license = {text = "BSD 3-Clause"}
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/okhlybov/autoc"

[tool.setuptools.package-data]
"autoc.doc" = ["*.md", "template/*", "template/.*"]
"autoc.cmake" = ["template/*", "template/.*", "template/cmake/*", "template/.vscode/*"]
"autoc.test" = ["template/*", "template/.*"]